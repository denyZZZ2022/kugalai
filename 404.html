<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080b" />
    <title>404 — KLUG Sound</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <style>
      .notfound {
        position: relative;
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        padding: 32px 20px;
        text-align: center;
      }

      .notfound::before,
      .notfound::after {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        filter: blur(110px);
        opacity: 0.28;
        content: "";
        pointer-events: none;
      }

      .notfound::before {
        top: -220px;
        left: -140px;
        background: #c6ff4a;
      }

      .notfound::after {
        right: -180px;
        bottom: -240px;
        background: #6fe7c4;
      }

      .nf-inner {
        position: relative;
        z-index: 1;
        width: min(620px, 100%);
      }

      .nf-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 42px;
        font-family: var(--font-display);
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.06em;
      }

      .nf-brand img {
        width: 42px;
        height: 42px;
      }

      .nf-brand span span {
        color: var(--accent);
      }

      .nf-code {
        font-family: var(--font-display);
        font-size: clamp(96px, 22vw, 190px);
        font-weight: 800;
        letter-spacing: -0.1em;
        line-height: 0.8;
        background: linear-gradient(110deg, #f4f6f9 15%, #c6ff4a 55%, #6fe7c4 95%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .nf-inner h1 {
        margin: 22px 0 12px;
        font-family: var(--font-display);
        font-size: clamp(26px, 5vw, 40px);
        font-weight: 600;
        letter-spacing: -0.06em;
        line-height: 1.1;
      }

      .nf-inner p {
        max-width: 44ch;
        margin: 0 auto 30px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .nf-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .nf-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        padding: 0 24px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        font-weight: 800;
        transition: transform 0.2s var(--ease), background-color 0.2s var(--ease);
      }

      .nf-actions a:hover {
        transform: translateY(-2px);
      }

      .nf-actions a:first-child {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-ink);
        box-shadow: var(--shadow-accent);
      }

      .nf-foot {
        margin-top: 46px;
        color: var(--faint);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="notfound">
      <div class="nf-inner">
        <a class="nf-brand" href="./index.html">
          <img src="./assets/favicon.svg" alt="" width="42" height="42" />
          <span>klug<span>sound</span></span>
        </a>
        <div class="nf-code">404</div>
        <h1>Эта страница ушла на репит</h1>
        <p>
          Такого адреса нет. Возможно, ссылка устарела или в ней опечатка. Вернись на главную
          или сразу открывай плеер — музыка уже ждёт.
        </p>
        <div class="nf-actions">
          <a href="./player.html">Открыть плеер</a>
          <a href="./index.html">На главную</a>
        </div>
        <div class="nf-foot">KLUG Sound · KlugAI Mini App</div>
      </div>
    </main>
  </body>
</html>
